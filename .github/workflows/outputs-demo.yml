  name: Outputs Demo
  on: push
  jobs:
    build:
      outputs:
        version_num: ${{ steps.step1.outputs.version }} 
      runs-on: ubuntu-latest
      steps:
        - name: Step One  
          id: step1
          run: echo "version=0.0.1" >> $GITHUB_OUTPUT    
        - name: Step Two
          run: echo "This version is ${{ steps.step1.outputs.version }}"
    deploy:
      needs: build
      runs-on: ubuntu-latest
      steps:
        - name: Deploy the App
          run: echo "we are deploying the app with version ${{needs.build.outputs.version_num }} "
          
